name = "portfolio-latest"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Secrets (do NOT put keys here — set them, don't commit them):
#   local dev  -> create .dev.vars   (see .dev.vars.example)
#   production -> `npx wrangler pages secret put OPENROUTER_API_KEY`
# Optional model override:
#   [vars]
#   MODEL = "mistralai/mistral-small-3.2-24b-instruct"

# Rate limiting (3 questions/IP/day + global cap). Create the namespace, then
# paste its id:  npx wrangler kv namespace create RATE
# Without this binding the /ask function runs with limits disabled (local dev).
# [[kv_namespaces]]
# binding = "RATE"
# id = "<paste-from-wrangler-kv-namespace-create>"
